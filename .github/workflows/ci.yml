name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant. Cancelling it
# keeps the queue short, which matters when four people are pushing in one afternoon.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Nx needs history to work out what changed between two commits.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # Caching is off because apps/api has no dependencies yet, so go.sum
          # does not exist and setup-go fails when it cannot resolve the path.
          # Once the first `go get` lands, switch this to:
          #   cache: true
          #   cache-dependency-path: apps/api/go.sum
          cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # gofmt is not part of `go vet`, so it needs its own step. The target forces
      # a non-zero exit, which `gofmt -l` alone does not do.
      - name: Check Go formatting
        run: npx nx fmt-check api

      - name: Lint
        run: npx nx run-many -t lint --parallel=3

      - name: Typecheck libraries
        run: |
          for lib in shared-types api-client ui; do
            npx tsc -p "libs/$lib/tsconfig.lib.json" --noEmit
          done

      - name: Test
        run: npx nx run-many -t test --parallel=3

      - name: Build
        run: npx nx run-many -t build --parallel=2

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The submission stands or falls on `docker compose up` working, so this runs
    # on every push rather than only before a release.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: waypoint-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: waypoint-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke-test the API container
        run: |
          docker run -d --name api-smoke -p 8080:8080 \
            -e APP_ENV=development \
            waypoint-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then
              echo "API is healthy"
              docker rm -f api-smoke
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy:"
          docker logs api-smoke
          docker rm -f api-smoke
          exit 1
